<article class="page figures-page">
    <header class="page-header">
        <h1 class="page-title">Figures</h1>
        <p class="page-lede">Candidate figures for the page heads: neural networks and alternative models of intelligence, each kept calm and abstract.</p>
    </header>
    <div class="page-content">
        <div class="figure-grid" id="figure-grid"></div>
    </div>
</article>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('figure-grid');
    if (!window.TufaFigures || !grid) return;
    const groups = [
        ['Point system', ['descent', 'fold', 'springs', 'attn3b', 'backprop', 'lens', 'rlsparse', 'lens2', 'passk', 'diffusion', 'grokking', 'conv', 'backprop2', 'resnet', 'gpu', 'kvcache', 'chip', 'tfm', 'scaling', 'rlenv', 'rlcont', 'attnpat', 'scaling2', 'epicycles', 'klpolicy', 'heads', 'arc3', 'chinchilla', 'grpo', 'life', 'flowmatch', 'flow', 'turing', 'curves', 'predictive', 'arc', 'attention', 'network', 'stokes', 'attractor']],
        ['Earlier studies', ['mlp', 'embedding', 'life', 'physarum', 'som', 'hopfield', 'evolution']],
    ];
    for (const [label, names] of groups) {
        const h = document.createElement('p'); h.className = 'figure-group'; h.textContent = label; grid.appendChild(h);
        for (const name of names) {
            const fig = TufaFigures.F[name];
            const card = document.createElement('figure'); card.className = 'figure-card';
            card.innerHTML = `<canvas aria-hidden="true"></canvas><figcaption><strong></strong><span></span><code></code></figcaption>`;
            card.querySelector('strong').textContent = fig.title;
            card.querySelector('span').textContent = fig.note;
            card.querySelector('code').textContent = name;
            grid.appendChild(card);
            const cv = card.querySelector('canvas');
            TufaFigures.mount(cv, name, (W, H) => ({ x: 8, y: 12, w: W - 16, h: H - 24 }));
        }
    }
});
</script>
