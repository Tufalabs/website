<!doctype html><meta charset=utf-8><body style="margin:0;background:#fff"><pre id=o></pre><canvas id=c></canvas>
<!-- the layered mark (paper colours) against the original 1c master (ink on paper): grey both, blue only the master, red only the mark.
     Also counts light pixels inside the silhouette's interior (seams between parts). Copy to out/ with mark.svg and the master. -->
<script>(async()=>{const W=2266,H=2232;const load=(s)=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s;});
const get=async(s)=>{const i=await load(s);const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(i,0,0,W,H);return g.getImageData(0,0,W,H).data;};
let svg=await (await fetch('/mark.svg?'+Math.random())).text(); svg=svg.replace(/var\(--mark-eye, #fff\)/g,'#fff').replace(/var\(--mark-pupil, currentColor\)/g,'#000').replace(/currentColor/g,'#000');
let m=await (await fetch('/ref1c.svg?'+Math.random())).text();
const A=await get('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(m)),B=await get('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
const c=document.getElementById('c');c.width=W;c.height=H;c.style.width=(W/2)+'px';const x=c.getContext('2d');const o=x.createImageData(W,H);let both=0,oa=0,ob=0,seam=0;
for(let i=0;i<W*H;i++){const va=A[i*4],vb=B[i*4],a=va<128,b=vb<128;const k=i*4;o.data[k+3]=255;
 if(a&&va<20&&vb>60&&vb<200)seam++;
 if(a&&b){both++;o.data[k]=o.data[k+1]=o.data[k+2]=180;}else if(a){oa++;o.data[k]=0;o.data[k+1]=80;o.data[k+2]=255;}else if(b){ob++;o.data[k]=255;o.data[k+1]=40;o.data[k+2]=0;}else{o.data[k]=o.data[k+1]=o.data[k+2]=255;}}
x.putImageData(o,0,0);document.getElementById('o').textContent=`IoU ${(both/(both+oa+ob)).toFixed(4)} · only master ${oa} · only mark ${ob} · grey pixels inside solid master areas ${seam}`;})();</script>
