# Build the site (Jekyll). main deploys to tufalabs.ai. (The redesign, with the identity's assets and the link-preview
# cards made in CI, is on the v2 branch.)
# A pull request (into main, or into v2, the redesign's branch) is published as a preview to Tufalabs/website-previews
# (GitHub Pages, private to the organisation) at pr-preview/pr-<n>/, with a comment on the pull request linking there;
# the preview is removed when the pull request closes. Writing there needs the secret PREVIEWS_KEY (a deploy key of
# website-previews with write access); without it the preview step is skipped.
name: Pages deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - v2
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # where this build is served: the root for main, a pull request's own folder for its preview
  BASE: ${{ github.event_name == 'pull_request' && format('/pr-preview/pr-{0}', github.event.number) || '' }}
  PREVIEWS: urban-carnival-kkllvv1.pages.github.io

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Verify Bundler version
        run: bundle _4.0.3_ -v

      - name: Build site
        run: |
          bundle _4.0.3_ exec jekyll clean --config site/_config.yml --source site --destination _site
          bundle _4.0.3_ exec jekyll build --config site/_config.yml --source site --destination _site --baseurl "$BASE"

      - name: Check generated files
        run: |
          test -f _site/index.html
          test -f _site/team/index.html
          test -f _site/research/index.html
          test -f _site/research/feed.xml
          test -f _site/news/index.html
          test -f _site/news/new-office/index.html
          test -f _site/news/intro-tufa-talks/index.html
          test -f _site/assets/css/site.css
          grep -q "Tufa Labs" _site/index.html
          grep -q "Latest Posts" _site/research/index.html
          grep -q "Introducing Tufa Talks" _site/news/index.html
          grep -q "<feed" _site/research/feed.xml

      # a preview: kept out of search engines
      - name: Preview paths and noindex
        if: github.event_name == 'pull_request'
        run: |
          find _site -name '*.html' -exec sed -i '0,/<head>/s||<head><meta name="robots" content="noindex, nofollow">|' {} +

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: _site

      - name: Upload the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # a pull request: its build at pr-preview/pr-<n>/ in website-previews, linked from a comment; taken down when it closes
  preview:
    if: github.event_name == 'pull_request' && !cancelled() && (needs.build.result == 'success' || github.event.action == 'closed')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_KEY: ${{ secrets.PREVIEWS_KEY != '' }}
      DIR: pr-preview/pr-${{ github.event.number }}
    steps:
      - name: No key yet
        if: env.HAS_KEY != 'true'
        run: |
          echo "::notice::No preview, as the secret PREVIEWS_KEY (a write deploy key of Tufalabs/website-previews) is not set"

      - name: Check out the previews
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: Tufalabs/website-previews
          ref: gh-pages
          ssh-key: ${{ secrets.PREVIEWS_KEY }}
          path: previews

      - uses: actions/download-artifact@v4
        if: env.HAS_KEY == 'true' && github.event.action != 'closed'
        with:
          name: site
          path: _site

      - name: Publish or remove the preview
        if: env.HAS_KEY == 'true'
        run: |
          cd previews
          rm -rf "$DIR"
          if [ "${{ github.event.action }}" != closed ]; then mkdir -p "$DIR" && cp -R ../_site/. "$DIR/"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "${{ github.event.action == 'closed' && 'Remove' || 'Preview' }} Tufalabs/website#${{ github.event.number }} (${{ github.event.pull_request.head.sha }})"
          for _ in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done

      - name: Comment
        if: env.HAS_KEY == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            ${{ github.event.action == 'closed' && 'Preview removed.' || format(':eyes: **Preview** (private to the organisation): https://{0}/{1}/', env.PREVIEWS, env.DIR) }}

            <sub>Built from ${{ github.event.pull_request.head.sha }}; updated on every push.</sub>
